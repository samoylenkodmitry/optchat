[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optchat"
version = "0.1.0"
description = "One memory for the coding agents of one user, served over MCP. It runs no models."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
optchat = "optchat.cli:main"

[tool.setuptools.packages.find]
include = ["optchat*"]
