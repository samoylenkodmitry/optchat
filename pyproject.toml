[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optchat"
version = "0.1.0"
description = "Model-free MCP memory and agent-driven binary compaction jobs"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
optchat = "optchat.cli:main"

[tool.setuptools.packages.find]
include = ["optchat*"]
